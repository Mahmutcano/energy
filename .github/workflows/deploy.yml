name: Build & Deploy YTBS Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Windows amd64 Binary
        run: |
          cd ytbs-service
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../ytbs-server.exe ./cmd/server
          ls -lh ../ytbs-server.exe

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytbs-server-windows-amd64
          path: ytbs-server.exe
          retention-days: 14

      # Optional SSH deploy if secrets are configured
      - name: Deploy to Remote Windows Server (85.111.7.170)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 85.111.7.170
          username: Administrator
          password: ${{ secrets.SERVER_PASSWORD || 'Adminpass123!' }}
          port: 22
          script: |
            powershell -ExecutionPolicy Bypass -Command "C:\energy\deploy\update-server.ps1"
