<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | YTBS SCADA Entegrasyon Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <div class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-xl">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-emerald-500 items-center justify-center text-white shadow-xl shadow-emerald-500/20 mb-4">
        <i class="fa-solid fa-bolt text-3xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">YTBS Entegrasyon Sistemi</h1>
      <p class="text-xs text-slate-400 mt-1 font-mono">TEİAŞ Lisanssız Üretim & SCADA Aktarım Merkezi</p>
    </div>

    <!-- Flash Error Message -->
    {{if .Error}}
    <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-3">
      <i class="fa-solid fa-circle-exclamation text-base"></i>
      <span>{{.Error}}</span>
    </div>
    {{end}}

    <!-- Form -->
    <form action="/login" method="POST" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Kullanıcı Adı</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-user"></i>
          </div>
          <input type="text" name="username" required value="admin"
                 class="w-full pl-10 pr-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                 placeholder="Kullanıcı adınızı girin">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Şifre</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </div>
          <input type="password" name="password" required value="Adminpass123!"
                 class="w-full pl-10 pr-4 py-3 bg-slate-800/60 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
                 placeholder="••••••••">
        </div>
      </div>

      <button type="submit"
              class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition transform active:scale-[0.98] flex items-center justify-center gap-2">
        <span>Giriş Yap</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
      Varsayılan Yönetici: <span class="font-mono text-slate-400">admin / Adminpass123!</span>
    </div>
  </div>

</body>
</html>
